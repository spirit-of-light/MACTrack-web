<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>MACTrack</title>
<style>
  /* Tokens: ai-factory/designs/frontend.md. Y2K console: gunmetal chassis, recessed plates, teal screens, maroon LEDs. */
  @font-face { font-family: Michroma; src: url(/assets/fonts/michroma-400.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Chakra Petch'; src: url(/assets/fonts/chakra-petch-400.woff2) format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Chakra Petch'; src: url(/assets/fonts/chakra-petch-600.woff2) format('woff2'); font-weight: 600; font-display: swap; }
  :root {
    color-scheme: dark; /* native date/time pickers and selects render dark */
    --day: 8.5rem; /* calendar day square; the Next boxes size from it */
    --cut: 10px; /* chamfered corner size */
    --chassis: #666666; --chassis-hi: #8C8C8C; --chassis-lo: #3A3A3A;
    --recess: #333333; --recess-hi: #4C4C4C; --recess-lo: #1C1C1C;
    --screen: #152D38; --screen-head: #0F222A; --screen-line: #27495A; --screen-weekend: #10242D;
    --screen-text: #D6E3E6; --screen-muted: #8FA9B1;
    --label: #EDEDED; --label-dim: #9C9C9C; /* --label on --chassis is about 4.9:1 */
    --primary: #7A013C; --primary-hi: #9C1A55; --primary-lo: #4E0026; --on-primary: #FFFFFF;
    --led: #E0457F; --led-glow: rgba(224, 69, 127, .55); --led-text: #FF7FA8; /* --led-text: LED colour as text on screens, about 6:1 */
    --amber: #F2B134; --led-ok: #57E389; /* --led-ok: a source synced fine */
    --overdue-bg: rgba(224, 69, 127, .16); --overdue-text: var(--led-text); --upcoming-bg: rgba(242, 177, 52, .10);
    --weekend-bg: var(--screen-weekend);
    --display: Michroma, 'Chakra Petch', sans-serif;
    --bracket: #4F7887; /* corner marks on screens */
    --bezel: #262626; /* dark frame every screen sits in */
    --glare: linear-gradient(160deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 35%); /* light across the glass */
    --scanlines: repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px); /* CRT lines, screens only */
    /* LEDs: radial-gradient dots, so no rounded corners are needed */
    /* An LED is three layers: a white glint, a domed lens (dim tinted glass when off, a hot core when on), and a metal
       socket ring. Lit ones also get a round glow from filter: drop-shadow (it follows the dot, not the box). */
    --led-glint: radial-gradient(circle closest-side at 36% 32%, rgba(255, 255, 255, .7) 0 9%, rgba(255, 255, 255, 0) 22%);
    --led-socket: radial-gradient(circle closest-side, transparent 63%, #0B0B0B 66%, #5C5C5C 76%, #222 88%, transparent 93%);
    --led-off: var(--led-glint),
      radial-gradient(circle closest-side at 45% 40%, #6A2A41 0, #3E1222 40%, #1C060F 62%, transparent 64%), var(--led-socket);
    --led-on: var(--led-glint),
      radial-gradient(circle closest-side at 45% 40%, #FFF0F5 0 10%, #FF7AAA 28%, var(--led) 46%, #8C1444 62%, transparent 64%), var(--led-socket);
    --led-on-ok: var(--led-glint),
      radial-gradient(circle closest-side at 45% 40%, #F0FFF4 0 10%, #8CF2AE 28%, var(--led-ok) 46%, #1D7A43 62%, transparent 64%), var(--led-socket);
    --led-on-amber: var(--led-glint),
      radial-gradient(circle closest-side at 45% 40%, #FFF8E6 0 10%, #FFD27A 28%, var(--amber) 46%, #8A5A0C 62%, transparent 64%), var(--led-socket);
    --glow: drop-shadow(0 0 3px var(--led-glow));
    --glow-ok: drop-shadow(0 0 3px rgba(87, 227, 137, .6));
    --glow-amber: drop-shadow(0 0 3px rgba(242, 177, 52, .6));
  }
  html { overscroll-behavior: none; scrollbar-color: var(--chassis-hi) var(--recess); } /* no rubber-band bounce (macOS) */
  /* Brushed gunmetal: fine horizontal grain over the chassis grey */
  body { font: 14px/1.35 'Chakra Petch', sans-serif; margin: 0 1.5rem 1.5rem; /* no top margin: the sticky top bar carries its own top padding */
    color: var(--label); background: var(--chassis); }
  ::selection { background: var(--primary); color: var(--on-primary); }
  a { color: var(--led-text); }
  :focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }

  /* Chamfered corners: top-left and bottom-right cut, like the reference consoles */
  #calendar, .next, .items, #grades, #sources {
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }

  /* Buttons: glossy maroon plates with a bevel; small wide-tracked caps */
  button { font: .62rem var(--display); letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
    color: var(--on-primary); padding: .45rem .8rem; border: 1px solid var(--primary-lo);
    background: linear-gradient(180deg, var(--primary-hi), var(--primary) 55%, var(--primary-lo));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), inset 0 -1px 0 rgba(0, 0, 0, .35);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
  button:hover, button:active { background: linear-gradient(180deg, #B02565, var(--primary-hi) 55%, var(--primary)); }
  /* Pressed: the plate sinks 1px and its bevel flips */
  button:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .55), inset 0 -1px 0 rgba(255, 255, 255, .08); }
  #save:disabled { opacity: .45; cursor: default; background: linear-gradient(180deg, var(--primary-hi), var(--primary) 55%, var(--primary-lo)); }
  button.icon, button.icon:hover { background: none; padding: 0; line-height: 0; border: 0; box-shadow: none; clip-path: none; }
  button.icon { color: var(--screen-muted); }
  button.icon:hover { color: var(--led); }
  td.act { padding: 0 2px; text-align: center; }

  /* Inputs: dark readout wells */
  input, select { font: inherit; color: var(--screen-text); background: #0B1C23; border: 1px solid var(--screen-line);
    box-shadow: inset 1px 1px 0 #050E12; padding: .15rem .3rem; }
  input::placeholder { color: var(--screen-muted); }
  input:focus, select:focus { border-color: var(--led); box-shadow: inset 1px 1px 0 #050E12, 0 0 0 1px var(--led), 0 0 6px var(--led-glow); outline: none; }
  input[type=checkbox] { accent-color: var(--led); }
  #add { display: flex; flex-direction: column; gap: .35rem; padding: .7rem; background: var(--recess);
    box-shadow: inset 1px 1px 0 var(--recess-hi), inset -1px -1px 0 var(--recess-lo); }
  #add[hidden] { display: none; }
  #add strong { font: .62rem var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
  #add input, #add select { width: 100%; box-sizing: border-box; min-width: 0; }
  .pair { display: flex; gap: .3rem; align-items: center; }
  .pair > * { flex: 1; min-width: 0; }
  .pair > input[type=date] { flex: 1.6; }
  /* No increment buttons on weight, mark and out of */
  td input[type=number], #add input[type=number] { appearance: textfield; -moz-appearance: textfield; }
  td input[type=number]::-webkit-inner-spin-button, #add input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  tr.changed td:first-child { box-shadow: inset 3px 0 var(--led); } /* unsaved edits */
  #edit { display: inline-flex; align-items: center; gap: .4rem; }

  /* Screens: teal display panels set into the chassis */
  .screen, .items, #grades, #sources, #calendar, .next {
    background:
      linear-gradient(var(--bracket), var(--bracket)) right 2px top 2px / 10px 1px no-repeat,
      linear-gradient(var(--bracket), var(--bracket)) right 2px top 2px / 1px 10px no-repeat,
      linear-gradient(var(--bracket), var(--bracket)) left 2px bottom 2px / 10px 1px no-repeat,
      linear-gradient(var(--bracket), var(--bracket)) left 2px bottom 2px / 1px 10px no-repeat,
      var(--glare),
      var(--scanlines),
      var(--screen);
    color: var(--screen-text); border: 4px solid var(--bezel);
    box-shadow: inset 0 0 0 1px var(--recess-lo), inset 2px 2px 0 #06141A, 0 1px 0 var(--chassis-hi); }

  /* Section labels: tiny wide-tracked caps between rows of hollow blocks */
  .list-h, #grades caption, #sources caption { display: flex; align-items: center; gap: .7rem; margin: .6rem 0 .35rem;
    font: .62rem var(--display); letter-spacing: .32em; text-transform: uppercase; color: var(--label); }
  .list-h::before, .list-h::after { content: ''; height: .5rem; flex: 0 0 2.6rem; border: 1px solid var(--label-dim); border-width: 1px 0;
    background: repeating-linear-gradient(90deg, var(--label-dim) 0 1px, transparent 1px 10px, var(--label-dim) 10px 11px, transparent 11px 13px); }
  .list-h::after { flex: 1; }
  /* The label is a dark tab plate between the ornaments: name, item count readout, status lamp */
  .list-h .tab { display: inline-flex; align-items: center; gap: .55rem; padding: .35rem .6rem .35rem .75rem;
    background: linear-gradient(180deg, #3D3D3D, var(--recess) 60%, #2A2A2A); box-shadow: inset 0 1px 0 var(--recess-hi), 0 1px 0 var(--chassis-hi);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .list-h .count { font: 600 .7rem 'Chakra Petch', sans-serif; letter-spacing: .1em; color: var(--label); padding: .05rem .35rem;
    background: #1E1E1E; box-shadow: inset 1px 1px 0 var(--recess-lo), inset -1px -1px 0 var(--recess-hi); }
  .list-h .lamp { margin-right: 0; }

  #sources, #grades { margin-top: 2rem; width: auto; }
  #sources { color: var(--screen-muted); }
  #grades td:first-child { color: var(--c); font-weight: 600; }
  .gauge { display: inline-block; width: 6rem; height: 9px; margin-right: .5rem; vertical-align: -1px;
    background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 6px) 0 0 / var(--fill, 0%) 100% no-repeat,
      repeating-linear-gradient(90deg, #24434F 0 4px, transparent 4px 6px); }
  .items tbody td.empty { padding: 1rem .3rem; text-align: left; color: var(--screen-muted); } /* beats the ✓ column centring */
  .items td.empty button { margin-left: .6rem; }

  /* Item list with the filter sidebar on its right */
  #layout { display: grid; grid-template-columns: minmax(0, 1fr) 10rem; gap: 1.5rem; align-items: start; --side: 10rem;
    /* a bevelled seam in the chassis between the list and the sidebar */
    background: linear-gradient(var(--chassis-lo), var(--chassis-lo)) right calc(var(--side) + .75rem) top 0 / 1px 100% no-repeat,
      linear-gradient(var(--chassis-hi), var(--chassis-hi)) right calc(var(--side) + .75rem - 1px) top 0 / 1px 100% no-repeat; }
  #layout.editing { grid-template-columns: minmax(0, 1fr) 15rem; --side: 15rem; } /* room for the Add item form */
  /* The top bar is a chassis plate that stays in view; a bevel line marks its lower edge */
  #cal-wrap { position: sticky; top: 0; z-index: 2; padding-bottom: .6rem;
    background: var(--chassis);
    box-shadow: 0 1px 0 var(--chassis-lo), 0 2px 0 var(--chassis-hi); }
  .items thead th { position: sticky; top: var(--head-top, 0); z-index: 1; } /* column titles stay below the calendar */
  #filters { position: sticky; top: var(--head-top, 0); max-height: calc(100vh - var(--head-top, 0px)); overflow-y: auto; box-sizing: border-box;
    padding-top: 1rem; display: flex; flex-direction: column; gap: 1rem; }
  @media (max-width: 900px) { #layout { grid-template-columns: 1fr; } #filters { position: static; order: -1; max-height: none; } }

  /* Filter tabs: dark recessed plates, LED on the right that lights when pressed */
  .chips { display: grid; grid-template-columns: 1fr; gap: .3rem; } /* one vertical column per filter group */
  .chips > span { display: flex; }
  .chips > span > button:first-child { flex: 1; }
  .chips button { position: relative; text-align: left; padding: .5rem 1.6rem .5rem 1.95rem; color: var(--label);
    font: 600 .76rem 'Chakra Petch', sans-serif; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid var(--recess-lo); background: linear-gradient(180deg, #3D3D3D, var(--recess) 60%, #2A2A2A);
    box-shadow: inset 0 1px 0 var(--recess-hi); }
  /* LED on the left; it alone shows the pressed state (no fill change) */
  .chips button::after { content: ''; position: absolute; left: .4rem; top: 50%; width: 20px; height: 20px; margin-top: -10px;
    background: var(--led-off); }
  .chips button[aria-pressed=true] { color: var(--on-primary); }
  .chips button[aria-pressed=true]::after { background: var(--led-on); filter: var(--glow); }
  /* Stippled triangle at the right end, as on the reference tabs; course buttons stipple it in their colour */
  .chips button::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 1.5rem; pointer-events: none;
    background: repeating-linear-gradient(0deg, var(--label-dim) 0 1px, transparent 1px 3px); /* horizontal lines; grey unless a course */
    clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  /* Course buttons: the triangle is filled with horizontal lines in the course colour, and a line of it runs along the bottom */
  .chips button.course::before { background: repeating-linear-gradient(0deg, var(--c) 0 1px, transparent 1px 3px); }
  .chips button.course { box-shadow: inset 0 1px 0 var(--recess-hi), inset 0 -2px 0 var(--c); }
  .chips button.eye::before { content: none; }
  .chips button:hover { color: var(--on-primary); background: linear-gradient(180deg, #474747, #3A3A3A 60%, #2E2E2E); }
  .chips .off { opacity: .5; }
  .chips button.eye, .chips button.eye:hover { background: none; color: var(--c); border: 0; box-shadow: none; clip-path: none;
    padding: 0 .2rem; vertical-align: middle; }
  .chips button.eye::after { content: none; }

  /* Tables */
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .2rem .35rem; border-bottom: 1px solid var(--screen-line); }
  th { font: 600 .7rem 'Chakra Petch', sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--screen-muted);
    background: var(--screen-head); padding-top: .45rem; padding-bottom: .45rem; }
  td.course { color: var(--c); font-weight: 600; white-space: nowrap; }
  td input, td select { width: 100%; box-sizing: border-box; min-width: 0; } /* stay inside fixed columns */
  td input[type=checkbox] { width: auto; margin: 0; }
  /* Item list: fixed column widths so filtering never shifts columns; Title takes the rest */
  .items { table-layout: fixed; border-collapse: separate; border-spacing: 0; } /* separate borders: sticky titles paint cleanly in Firefox */
  .items td { overflow-wrap: anywhere; }
  /* Tests and Labs side by side (stacked in edit mode, or full width when the other is empty), with narrower columns */
  #pair { display: flex; gap: 1.5rem; align-items: flex-start; }
  #pair > div { flex: 1; min-width: 0; }
  #layout.editing #pair { display: block; }
  #layout:not(.editing) #pair col.course { width: 7.5rem; } #layout:not(.editing) #pair col.due { width: 7rem; }
  #layout:not(.editing) #pair col.left { width: 5rem; } #layout:not(.editing) #pair col.weight { width: 3.8rem; }
  #layout:not(.editing) #pair col.mark { width: 4rem; }
  #pair td { overflow-wrap: break-word; } /* break long words only when they cannot fit on a line of their own */
  .items th:first-child, .items td:first-child { padding: 0 2px; text-align: center; }
  col.done { width: var(--tick, 1.2em); } /* checkmark width + 4px, measured at load */
  col.type { width: 6.5rem; } col.course { width: 8rem; } col.due { width: 9.5rem; } col.left { width: 7.5rem; }
  col.weight { width: 4.5rem; } col.mark { width: 6rem; } col.actions { width: 22px; } /* 18px trash icon + 4px */
  .editing col.done { width: 17px; } .editing col.type { width: 7rem; } .editing col.due { width: 15.5rem; }
  .editing col.left { width: 6rem; } .editing col.weight { width: 4rem; } .editing col.mark { width: 7rem; }
  /* Due cell: date right-aligned in a slot as wide as the widest date, so the dots line up */
  div.due { display: grid; grid-template-columns: var(--date-w, max-content) 7px max-content; gap: .35em; align-items: center; }
  div.due span:first-child { text-align: right; }
  div.due svg { width: 7px; height: 7px; color: var(--led); }
  tr.overdue { background: var(--overdue-bg); box-shadow: inset 3px 0 var(--overdue-text); }
  tr.overdue td:nth-child(6) { color: var(--overdue-text); font-weight: 600; } /* "… overdue" in Time left */
  tr.upcoming { background: var(--upcoming-bg); box-shadow: inset 3px 0 var(--amber); }
  tr.missing { opacity: .55; }
  .items tbody tr:hover td, #grades tbody tr:hover td { background: rgba(255, 255, 255, .045); } /* row under the mouse */
  tr.hl { background: rgba(224, 69, 127, .22); box-shadow: inset 3px 0 var(--led); } /* due on the hovered calendar day */
  tr.off { opacity: .5; }
  .info { color: var(--label); margin: .4rem 0; }

  /* Calendar arrows: small recessed keys */
  #cal-nav { display: flex; flex-direction: column; gap: .3rem; } /* up: back a week, circle: today, down: forward a week */
  #cal-nav button { padding: .35rem; line-height: 0; color: var(--label); border-color: var(--recess-lo);
    background: linear-gradient(180deg, #3D3D3D, var(--recess) 60%, #2A2A2A); box-shadow: inset 0 1px 0 var(--recess-hi); }
  #cal-nav button:hover { color: var(--led); }
  /* Calendar: the main display. Fixed square days, 7 per row; a full day hides its last items behind "+N more" */
  #calendar { flex: none; display: grid; grid-template-columns: 1.5rem repeat(7, var(--day)); grid-auto-rows: var(--day);
    padding: 2px; }
  .day { border-right: 1px solid var(--screen-line); border-bottom: 1px solid var(--screen-line); padding: .35rem .45rem;
    box-sizing: border-box; overflow: hidden; overflow-wrap: anywhere; }
  .day:nth-child(8n) { border-right: 0; } /* 8 cells a row: week strip + 7 days */
  .day:nth-last-child(-n + 7) { border-bottom: 0; }
  /* Week strip: a recessed plate down the left of each row with the ISO week number */
  .wk { writing-mode: sideways-lr; text-align: center; font: .5rem var(--display); letter-spacing: .22em; color: var(--label);
    background: linear-gradient(90deg, #3D3D3D, var(--recess) 60%, #2A2A2A); box-shadow: inset 0 -1px 0 var(--recess-lo); }
  /* Day header: big date numeral, weekday and month small beside it */
  .day h3 { display: flex; align-items: baseline; gap: .35rem; margin: 0 0 .35rem;
    font: .52rem var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--screen-muted); }
  .day h3 b { font: 1.2rem var(--display); letter-spacing: 0; color: var(--screen-text); }
  .day.today h3 b { color: var(--led-text); }
  .day.today { box-shadow: inset 0 2px 0 var(--led); }
  .day.today h3 { color: var(--led-text); }
  .day.today h3::after { content: ''; align-self: center; width: 14px; height: 14px; margin-left: auto; background: var(--led-on); filter: var(--glow); }
  .day.weekend { background: var(--scanlines), var(--weekend-bg); }
  .day:hover { box-shadow: inset 0 0 0 1px var(--bracket); }
  .day.today:hover { box-shadow: inset 0 2px 0 var(--led), inset 0 0 0 1px var(--bracket); }
  .day.hl { background: rgba(224, 69, 127, .2); box-shadow: inset 0 0 0 2px var(--led); } /* hovered row's due day */
  .day p { margin: 0 0 .3rem; border-left: 3px solid var(--c); padding-left: .3rem; font-size: .85em; line-height: 1.2; }
  .day p b { color: var(--c); font-weight: 600; }
  .day p.done { text-decoration: line-through; color: var(--screen-muted); }
  .day .more { font: .55rem var(--display); letter-spacing: .1em; color: var(--led-text); }

  /* Top bar: the calendar, its arrows, then the Next test and Next lab readouts */
  #top { display: flex; gap: .8rem; align-items: flex-start; } /* Next blocks keep their own height */
  /* Nameplate strip at the top of the sticky bar: badge, vent grille, a status LED per website, last sync */
  #plate { display: flex; align-items: center; gap: 1rem; padding: .7rem 0 .6rem; }
  #brand { display: flex; align-items: center; gap: .6rem; }
  #brand svg { width: 30px; height: 30px; color: var(--label); }
  #brand b { font: 1.05rem var(--display); letter-spacing: .38em; color: var(--label);
    text-shadow: 0 1px 0 var(--chassis-lo), 0 -1px 0 var(--chassis-hi); } /* stamped into the metal */
  #brand small { display: block; font: 600 .6rem 'Chakra Petch', sans-serif; letter-spacing: .32em; text-transform: uppercase; color: var(--label); }
  .vent { flex: 1; min-width: 3rem; height: 14px;
    background: repeating-linear-gradient(90deg, var(--recess-lo) 0 2px, var(--chassis-hi) 2px 3px, transparent 3px 6px);
    box-shadow: inset 0 1px 0 var(--chassis-lo), 0 1px 0 var(--chassis-hi); }
  #links { display: flex; gap: 1rem; font: 600 .66rem 'Chakra Petch', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--label); }
  /* Status lamps: green ok, amber attention, maroon problem. Used by the nameplate, section headings and the sync table. */
  #links span::after, .lamp { content: ''; display: inline-block; width: 14px; height: 14px; vertical-align: -3px; background: var(--led-off); }
  #links span::after { margin-left: .3rem; }
  #links .ok::after, .lamp.ok { background: var(--led-on-ok); filter: var(--glow-ok); }
  #links .login::after, .lamp.login { background: var(--led-on-amber); filter: var(--glow-amber); }
  #links .error::after, .lamp.error { background: var(--led-on); filter: var(--glow); }
  .lamp { margin-right: .35rem; }
  #synced, #host, #tally { font: .52rem var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--label); padding: .35rem .55rem;
    background: var(--recess); box-shadow: inset 1px 1px 0 var(--recess-lo), inset -1px -1px 0 var(--recess-hi); white-space: nowrap; }
  #tally span + span { margin-left: .6rem; padding-left: .6rem; box-shadow: inset 1px 0 0 var(--recess-hi); }
  #foot { display: flex; align-items: center; gap: 1rem; margin-top: 1.4rem; }
  #next-test, #next-lab { flex: 1; min-width: 0; } /* two equal boxes fill the rest of the top bar */
  /* Next boxes: as tall as the calendar. A recessed title plate with a lit LED, then the readout. Text scales with the
     box width (cqw), capped. Course and title on the left; date, time and details right-aligned opposite them. */
  .next { height: calc(2 * var(--day) + 12px); /* the calendar's height: two rows, padding and bezel */ box-sizing: border-box; overflow: hidden; padding: 0 .7rem .6rem;

<script>

// Spec 0002 AC16: copy of extension/parse.js SITES[*].login; Crowdmark signs in through Avenue (session default).

const roomOf = (title, info = []) => {

  return (info.find((f) => /room|location/i.test(f.name) && f.name.toLowerCase().startsWith(t)

const $ = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const CAL_DAYS = 14; // calendar length: two rows of 7
const STEP = 7; // the arrows move the calendar a week
const UPCOMING_DAYS = 7; // AC41: due within this many days counts as upcoming (fixed since 2026-10-19)
const round2 = (v) => (v == null ? '' : Math.round(v * 100) / 100); // display only; edit mode keeps the exact value
const editing = () => localStorage.getItem('editMode') === '1'; // view mode by default; browser only
const hiddenCourses = () => { try { return JSON.parse(localStorage.getItem('hiddenCourses')) || []; } catch { return []; } }; // browser only
const setHidden = (list) => { localStorage.setItem('hiddenCourses', JSON.stringify(list)); render(); };

// Built with DOM calls, never parsed from a string.
const icon = (stroke, fill = '') => {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  for (const [k, v] of Object.entries({ viewBox: '0 0 24 24', width: 18, height: 18, fill: 'none', stroke: 'currentColor',
    'stroke-width': 2, 'stroke-linejoin': 'miter', 'stroke-linecap': 'square', 'aria-hidden': 'true' })) svg.setAttribute(k, v);
  for (const [d, filled] of [[stroke, false], [fill, true]]) {
    if (!d) continue;
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    if (filled) { path.setAttribute('fill', 'currentColor'); path.setAttribute('stroke', 'none'); }
    svg.append(path);
  }

};
const EYE = ['M2 12l5-6h10l5 6-5 6H7z', 'M12 8.5l3.5 3.5-3.5 3.5-3.5-3.5z']; // hex lens, diamond pupil
const EYE_SHUT = ['M2 10l5 5h10l5-5M6 16l-2 3M12 17v3M18 16l2 3'];
const PENCIL = ['M4 20v-5L15 4l5 5L9 20zM13 6l5 5', 'M4 20v-5l5 5z']; // stylus with a filled tip
const MONITOR = ['M3 4h16l2 2v11H5l-2-2zM9 21h6M12 17v4M7 8h10M7 11h10M7 14h6']; // screen with scanlines
const TRASH = ['M3 6h18M9 6V3h6v3M5 6l1.5 13 2 2h7l2-2L19 6M10 10v7M14 10v7'];
const UP = ['', 'M12 3l8 8h-5v8l-2 2h-2l-2-2v-8H4z'];
const DOWN = ['', 'M12 21l8-8h-5V5l-2-2h-2L9 5v8H4z'];
const RETICLE = ['M8 3h8l5 5v8l-5 5H8l-5-5V8zM12 1v4M12 19v4M1 12h4M19 12h4', 'M10 10h4v4h-4z']; // back to today: target lock
const BADGE = ['M7 2h10l5 5v10l-5 5H7l-5-5V7z', 'M7 8h10v2H7zM7 11h7v2H7zM7 14h10v2H7z']; // octagon badge, three bars
let data = { items: [], courses: {} };
let status = {};
let calOffset = 0; // calendar start, in days from today; not saved
// Filters: course ('' is All) and Hide done; remembered in this browser only. Types need no filter: tests and labs have their own tables.
const savedFilters = (() => { try { return JSON.parse(localStorage.getItem('filters')) || {}; } catch { return {}; } })();
let course = savedFilters.course ?? '';
let hideDone = !!savedFilters.hideDone;
const pending = new Map(); // item id -> { raw: changed input values, fields: what Save sends }; kept across re-renders

const dueMs = (i) => (i.due ? new Date(i.due).getTime() : Infinity);
const overdue = (i) => !i.done && dueMs(i) < Date.now();
const upcoming = (i) => !i.done && dueMs(i) >= Date.now() && dueMs(i) <= Date.now() + UPCOMING_DAYS * 864e5;
const courseOf = (i) => i.course ?? '(no course)';
const left = (i) => { // time until due, e.g. "3d 4h" or "5h 20m"; computed at render
  if (i.done || !i.due) return '';
  const ms = dueMs(i) - Date.now();
  const m = Math.floor(Math.abs(ms) / 6e4);
  const t = m >= 1440 ? `${Math.floor(m / 1440)}d ${Math.floor(m / 60) % 24}h` : `${Math.floor(m / 60)}h ${m % 60}m`;
  return ms < 0 ? `${t} overdue` : t;
};
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pad = (n) => String(n).padStart(2, '0');
const dueText = (iso, now = new Date()) => { // ["dd Mon", "hh:mm"], with the year only when it is not this year
  if (!iso) return [];
  const d = new Date(iso);
  const year = d.getFullYear() === now.getFullYear() ? '' : ` ${d.getFullYear()}`;
  return [`${pad(d.getDate())} ${MONTHS[d.getMonth()]}${year}`, `${pad(d.getHours())}:${pad(d.getMinutes())}`];
};
const DIAMOND = ['', 'M12 4l8 8-8 8-8-8z'];
const dateTime = (iso) => { // "dd Mon • hh:mm" as a 3-part grid; alignDots() lines the dots up per table
  const [date, time] = dueText(iso);
  const dot = icon(...DIAMOND);
  return $('div', { className: 'due' }, $('span', { textContent: date }), dot, $('span', { textContent: time }));
};
// Line the dots up: size every date slot in a table to its widest date, measured with the slot unset
const alignDots = (table) => {
  table.style.removeProperty('--date-w');
  const widths = [...table.querySelectorAll('.due span:first-child')].map((e) => e.getBoundingClientRect().width);
  if (widths.length) table.style.setProperty('--date-w', `${Math.ceil(Math.max(...widths))}px`);
};
const markText = (i) => (i.mark == null ? '' : i.out_of == null ? round2(i.mark) : `${round2(i.mark)} / ${round2(i.out_of)}`);
const localInput = (iso) => { // ISO -> ['YYYY-MM-DD', 'hh:mm'] for <input type=date> and <input type=time>
  if (!iso) return ['', ''];
  const d = new Date(iso);
  return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16).split('T');
};
const joinDue = (date, time) => (date ? new Date(`${date}T${time || '23:59'}`).toISOString() : null); // no time: end of day

async function load() {
  [data, status] = await Promise.all([
    fetch('/api/items').then((r) => r.json()),
    fetch('/api/status').then((r) => r.json()),
  ]);
  for (const id of pending.keys()) if (!data.items.some((i) => i.id === id)) pending.delete(id);
  render();
}

const raw = (input) => (input.type === 'checkbox' ? input.checked : input.value);
const parsed = (input) => (input.type === 'checkbox' ? input.checked
  : input.type === 'number' ? (input.value === '' ? null : Number(input.value))
  : input.value);

// AC31: one Save for every changed row; each item gets one POST with only its changed fields, then reload.
async function saveAll() {
  for (const [id, p] of pending) {
    const r = await fetch(`/api/items/${id}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p.fields),
    });
    if (!r.ok) { alert(`Save failed: ${r.status}`); break; }
    pending.delete(id);
  }
  load();
}
const saveState = () => {
  const b = document.getElementById('save');
  b.disabled = !pending.size;
  b.textContent = pending.size ? `Save (${pending.size})` : 'Save';
};

// AC105/AC111: add a manual item; empty optional fields are left out.
async function add(ev) {
  ev.preventDefault();
  const body = {};
  for (const input of ev.target.querySelectorAll('[name]:not([name=date]):not([name=time])')) {
    const v = parsed(input);
    if (v !== null && v !== '') body[input.name] = v;
  }
  const due = joinDue(ev.target.elements.date.value, ev.target.elements.time.value);
  if (due) body.due = due;
  const r = await fetch('/api/items', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!r.ok) return alert(`Add failed: ${r.status}`);
  ev.target.reset();
  load();
}

// AC108: only manual items can be deleted.
async function remove(item) {
  if (!confirm(`Delete "${item.title}"?`)) return;
  const r = await fetch(`/api/items/${item.id}/delete`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
  });
  if (!r.ok) alert(`Delete failed: ${r.status}`);
  load();
}

function row(item) {
  if (!editing()) { // view mode: plain text, no controls
    const tr = $('tr', {}, ...[item.done ? '✓' : '', item.kind ?? '', courseOf(item),
      (item.title ?? '') + (item.missing ? ' (missing from source)' : ''),
      '', left(item), round2(item.weight), markText(item)]
      .map((t) => $('td', { textContent: String(t) })));
    tr.children[2].className = 'course';
    tr.children[5].className = 'left'; // tick() finds it by class: the tests table drops the Type column
    if (/^https?:\/\//i.test(item.url ?? '')) tr.children[3].replaceChildren(
      $('a', { href: item.url, target: '_blank', rel: 'noopener', textContent: item.title ?? '' }),
      item.missing ? ' (missing from source)' : '');
    if (item.due) {
      tr.children[4].replaceChildren(dateTime(item.due));
    }
    tr.classList.toggle('overdue', overdue(item));
    tr.classList.toggle('upcoming', upcoming(item));
    tr.classList.toggle('missing', !!item.missing);
    return tr;
  }
  const [date, time] = localInput(item.due);
  const inputs = {
    done: $('input', { type: 'checkbox', checked: !!item.done }),
    title: $('input', { value: item.title ?? '' }),
    kind: $('select', {}, ...KINDS.map((k) => $('option', { value: k, textContent: k, selected: k === item.kind }))),
    date: $('input', { type: 'date', value: date }),
    time: $('input', { type: 'time', value: time }),
    weight: $('input', { type: 'number', step: 'any', value: item.weight ?? '' }),
    mark: $('input', { type: 'number', step: 'any', value: item.mark ?? '' }),
    out_of: $('input', { type: 'number', step: 'any', value: item.out_of ?? '' }),
  };
  const orig = Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, raw(i)]));
  for (const [k, v] of Object.entries(pending.get(item.id)?.raw ?? {})) inputs[k][k === 'done' ? 'checked' : 'value'] = v;
  const trash = tip($('button', { className: 'icon', onclick: () => remove(item) }, icon(...TRASH)), `Delete ${item.title ?? ''}`);
  trash.setAttribute('aria-label', trash.dataset.tip);
  const tr = tip($('tr', {},
    $('td', {}, inputs.done), $('td', {}, inputs.kind), $('td', { className: 'course', textContent: courseOf(item) }),
    $('td', {}, inputs.title), $('td', {}, $('div', { className: 'pair' }, inputs.date, inputs.time)),
    $('td', { className: 'left', textContent: left(item) }), $('td', {}, inputs.weight),
    $('td', {}, $('div', { className: 'pair' }, inputs.mark, '/', inputs.out_of)),
    $('td', { className: 'act' }, ...(item.source === 'manual' ? [trash] : []))), `From ${item.source}${item.missing ? ', missing from source' : ''}`);

    const changed = Object.keys(inputs).filter((k) => raw(inputs[k]) !== orig[k]);
    const fields = Object.fromEntries(changed.filter((k) => k !== 'date' && k !== 'time').map((k) => [k, parsed(inputs[k])]));

  };

  tr.classList.toggle('changed', pending.has(item.id));
  tr.classList.toggle('overdue', overdue(item));
  tr.classList.toggle('upcoming', upcoming(item));
  tr.classList.toggle('missing', !!item.missing);
  return tr;
}

// A row of toggle buttons, All first; the pressed one is the current filter.
const chips = (values, current, pick) => ['', ...values].map((v) => {
  const b = $('button', { textContent: v || 'All', onclick: () => { pick(v); render(); } });
  b.setAttribute('aria-pressed', String(v === current));
  return b;
});

// CAL_DAYS days from today + calOffset, each with the items due that local day.
// ISO 8601 week number of a local date.
const isoWeek = (d) => {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
};

function calendar(items, colorOf) {
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() + calOffset);
  return Array.from({ length: CAL_DAYS }, (_, k) => {
    const from = new Date(start);
    from.setDate(start.getDate() + k);
    const to = new Date(from);
    to.setDate(from.getDate() + 1);
    const today = calOffset + k === 0;
    const day = localInput(from.toISOString())[0];
    const hl = (on) => document.querySelectorAll(`.items tbody tr[data-day="${day}"]`).forEach((tr) => tr.classList.toggle('hl', on));
    const label = from.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    const small = today ? 'Today' : from.toLocaleDateString(undefined, { weekday: 'short', month: 'short' });
    const weekend = from.getDay() === 0 || from.getDay() === 6;
    const cell = $('div', { className: ['day', ...(today ? ['today'] : []), ...(weekend ? ['weekend'] : [])].join(' '), onmouseenter: () => hl(true), onmouseleave: () => hl(false) },
      $('h3', {}, $('b', { textContent: String(from.getDate()).padStart(2, '0') }), $('span', { textContent: small })),
      ...items.filter((i) => dueMs(i) >= from && dueMs(i) < to).sort((a, b) => dueMs(a) - dueMs(b)).map((i) => {
        const c = i.course ?? '(no course)';
        const p = $('p', { className: i.done ? 'done' : '' }, $('b', { textContent: c }), ` ${i.title ?? ''}`);
        p.style.setProperty('--c', colorOf(c));
        return p;
      }));
    cell.dataset.day = day;
    cell.dataset.label = today ? `${label} (today)` : label;
    if (k % 7) return [cell];
    // each row of 7 days opens with its week strip: the ISO week(s) it covers
    const last = new Date(from);
    last.setDate(from.getDate() + 6);
    const [a, b] = [isoWeek(from), isoWeek(last)];
    return [tip($('div', { className: 'wk', textContent: a === b ? `Wk ${a}` : `Wk ${a}-${b}` }), a === b ? `Week ${a}` : `Weeks ${a} and ${b}`), cell];
  }).flat();
}

function render() {
  document.getElementById('add').hidden = !editing();
  document.getElementById('save').hidden = !editing();
  saveState();
  // Mode switch: pencil + Edit in view mode, page + View in edit mode
  document.getElementById('edit').replaceChildren(icon(...(editing() ? MONITOR : PENCIL)), editing() ? 'View' : 'Edit');
  // Nameplate: one LED per website (green ok, amber needs sign-in, maroon error), and the latest sync time
  document.getElementById('links').replaceChildren(...Object.entries(status).map(([src, s]) => tip($('span', {
    className: { ok: 'ok', 'login needed': 'login', error: 'error' }[s.status] ?? '',
    textContent: src[0].toUpperCase() + src.slice(1) }), `${src[0].toUpperCase() + src.slice(1)}: ${s.status}`)));

  const lastSync = Object.values(status).map((s) => s.synced_at).filter(Boolean).sort().pop();
  document.getElementById('synced').textContent = lastSync ? `Synced ${dueText(lastSync).join(' ')}` : 'Not synced yet';
  // AC30: sync status per source in the bottom table; for "login needed" the word "login" is the sign-in link.
  document.querySelector('#sources tbody').replaceChildren(...Object.entries(status).map(([src, s]) => $('tr', {},
    $('td', { textContent: src[0].toUpperCase() + src.slice(1) }),
    $('td', {}, $('span', { className: `lamp ${{ ok: 'ok', 'login needed': 'login', error: 'error' }[s.status] ?? ''}` }), ...(s.status === 'login needed'
      ? [$('a', { href: LOGIN[src], target: '_blank', rel: 'noopener', textContent: 'login' }), ' needed']
      : [s.status])),
    $('td', {}, s.synced_at ? dateTime(s.synced_at) : ''))));

  const all = [...new Set(data.items.map(courseOf))].sort();
  const hidden = hiddenCourses();
  const visible = all.filter((c) => !hidden.includes(c));
  const courses = editing() ? all : visible; // edit mode lists hidden courses too, so they can be shown again
  if (!courses.includes(course)) course = '';
  localStorage.setItem('filters', JSON.stringify({ course, hideDone }));
  const addCourse = document.querySelector('#add [name=course]');
  const was = addCourse.value;
  addCourse.replaceChildren($('option', { value: '', textContent: 'Course' }),
    ...all.filter((c) => c !== '(no course)').map((c) => $('option', { value: c, textContent: c, selected: c === was })));
  const open = data.items.filter((i) => visible.includes(courseOf(i)) && shownKind(i) && !i.done).length;
  document.getElementById('tally').replaceChildren($('span', { textContent: `Courses ${String(visible.length).padStart(2, '0')}` }),
    $('span', { textContent: `Open ${String(open).padStart(2, '0')}` }));
  const colorOf = (c) => `hsl(${(all.indexOf(c) * 137) % 360} 60% 68%)`; // AC26: page-derived course color, light enough for the teal screens; hiding keeps colours

  document.getElementById('courses').replaceChildren(...chips(courses, course, (v) => { course = v; }).map((b, n) => {
    if (!n) return b;
    const c = courses[n - 1];
    b.style.setProperty('--c', colorOf(c));
    b.classList.add('course');
    if (!editing()) return b;
    const off = hidden.includes(c);
    const eye = $('button', { className: 'eye',
      onclick: () => setHidden(off ? hidden.filter((h) => h !== c) : [...hidden, c]) });
    tip(eye, off ? `Show ${c}` : `Hide ${c}`);
    eye.setAttribute('aria-label', eye.dataset.tip);
    eye.style.setProperty('--c', colorOf(c));
    eye.append(icon(...(off ? EYE_SHUT : EYE)));
    return $('span', { className: off ? 'off' : '' }, b, eye);
  }));

  const hide = $('button', { textContent: 'Hide done', onclick: () => { hideDone = !hideDone; render(); } });
  hide.setAttribute('aria-pressed', String(hideDone));
  document.getElementById('statuses').replaceChildren(hide);
  const keep = (i) => shownKind(i) && !(hideDone && i.done);
  const picked = (c) => !course || c === course;
  const cal = document.getElementById('calendar');
  cal.replaceChildren(...calendar(data.items.filter((i) => visible.includes(courseOf(i)) && picked(courseOf(i)) && keep(i)), colorOf));
  for (const day of cal.querySelectorAll('.day')) { // a day with more than fits hides its last items behind "+N more"
    if (day.scrollHeight <= day.clientHeight) continue;
    const items = [...day.querySelectorAll('p')];
    tip(day, [day.dataset.label, ...items.map((p) => p.textContent)].join('\n')); // what "+N more" hides
    const more = day.appendChild($('div', { className: 'more' }));
    for (let n = 1; n <= items.length && day.scrollHeight > day.clientHeight; n++) {
      items[items.length - n].hidden = true;
      more.textContent = `+${n} more`;
    }
  }

  // Next test / Next lab: the soonest test (test, exam, midterm) and lab still ahead. Hidden courses and the course
  // filter apply. Hovering a row in the Tests or Labs table shows that item in its box as "Selected …".
  const ahead = data.items.filter((i) => shownKind(i) && !i.done && i.due && dueMs(i) >= Date.now() && visible.includes(courseOf(i))
    && picked(courseOf(i))).sort((a, b) => dueMs(a) - dueMs(b));
  const box = (id, heading, i, empty, room) => {
    const el = document.getElementById(id);
    el.style.setProperty('--c', i ? colorOf(courseOf(i)) : '');
    const [date, time] = i ? dueText(i.due) : [];
    el.replaceChildren($('h3', { textContent: heading }), i ? $('div', { className: 'body' },
      $('div', { className: 'who' },
        $('p', { className: 'course', textContent: courseOf(i) }),
        tip($('p', { className: 'title', textContent: i.title ?? '' }), i.title ?? '')),
      $('div', { className: 'what' },
        ...[date, time].filter(Boolean).map((t) => $('p', { className: 'when', textContent: t })),
        ...[left(i) && (overdue(i) ? left(i) : `in ${left(i)}`), i.weight != null && `worth ${round2(i.weight)}%`, `Room ${room ?? 'TBD'}`]
          .filter(Boolean).map((t) => $('p', { className: 'muted', textContent: t }))))
      : $('p', { className: 'muted', textContent: empty }));
    if (i && i.due && !i.done) { // share of the next 14 days still left before the due time
      const meter = tip($('div', { className: 'meter' }), 'Time left, out of 14 days');
      meter.style.setProperty('--fill', `${Math.max(0, Math.min(1, (dueMs(i) - Date.now()) / (14 * 864e5))) * 100}%`);
      el.append(meter);
    }
  };
  const info = (i) => data.courses[courseOf(i)]?.info;
  const nextTest = ahead.find((i) => TESTS.includes(i.kind));
  const nextLab = ahead.find(isLab);
  showPicked = (i) => { // i: a hovered test or lab, or null to show the next ones
    const test = i && TESTS.includes(i.kind) ? i : null;
    const lab = i && isLab(i) ? i : null;
    box('next-test', test ? 'Selected test' : 'Next test', test || nextTest, 'No tests scheduled',
      (test || nextTest) && roomOf((test || nextTest).title, info(test || nextTest)));
    box('next-lab', lab ? 'Selected lab' : 'Next lab', lab || nextLab, 'No labs scheduled',
      (lab || nextLab) && (roomOf((lab || nextLab).title, info(lab || nextLab)) ?? roomOf('Lab', info(lab || nextLab))));
  };
  showPicked(null);

  const g = data.courses[course] || { grade: null, graded_pct: 0 };
  const summary = document.getElementById('summary');
  summary.hidden = !course;
  summary.textContent = [course, ...(g.grade == null ? [] : [`${g.grade.toFixed(1)}%`]), `${(g.graded_pct || 0).toFixed(0)}% Graded`,
    ...(g.approximate ? ['approximate'] : []), ...(g.info || []).map((i) => `${i.name}: ${i.value}`)].join(' | '); // AC29/AC91

  const cols = ['done', 'type', 'course', 'title', 'due', 'left', 'weight', 'mark', ...(editing() ? ['actions'] : [])];
  document.getElementById('layout').classList.toggle('editing', editing());
  const done = () => { const th = tip($('th', { textContent: '✓' }), 'Done'); th.setAttribute('aria-label', 'Done'); return th; };
  const toRow = (i) => {
    const tr = row(i);
    tr.item = i; // for tick()
    tr.style.setProperty('--c', colorOf(courseOf(i)));
    tr.classList.toggle('off', hidden.includes(courseOf(i)));
    if (TESTS.includes(i.kind) || isLab(i)) {
      tr.addEventListener('mouseenter', () => showPicked(i));
      tr.addEventListener('mouseleave', () => showPicked(null));
    }
    if (i.due) { // local due date: calendar hover finds these rows, row hover finds its calendar day
      const day = localInput(i.due)[0];
      tr.dataset.day = day;
      const hl = (on) => document.querySelector(`#calendar .day[data-day="${day}"]`)?.classList.toggle('hl', on);
      tr.addEventListener('mouseenter', () => hl(true));
      tr.addEventListener('mouseleave', () => hl(false));
    }
    return tr;
  };
  const shown = data.items.filter((i) => courses.includes(courseOf(i)) && picked(courseOf(i)) && keep(i))
    .sort((a, b) => !!a.done - !!b.done || dueMs(a) - dueMs(b)); // not done first, then by due date
  // Tests (test, exam, midterm) and labs get their own tables above the coursework. Each is one type, so it has no
  // Type column; the rest of the columns match, so they line up.
  const parts = [['tests', shown.filter((i) => TESTS.includes(i.kind))], ['labs', shown.filter(isLab)],
    ['items', shown.filter((i) => !TESTS.includes(i.kind) && !isLab(i))]];
  for (const [id, items] of parts) {
    const typed = id === 'items' || editing(); // edit mode shows Type everywhere so a test or lab can be re-typed
    const table = document.getElementById(id);
    table.classList.toggle('editing', editing());
    table.querySelector('colgroup').replaceChildren(...cols.filter((c) => typed || c !== 'type').map((c) => $('col', { className: c })));
    table.querySelector('thead').replaceChildren($('tr', {}, done(), ...['Type', 'Course', 'Title', 'Due', 'Time left', 'Weight', 'Mark',
      ...(editing() ? [''] : [])].filter((h) => typed || h !== 'Type')
      .map((h) => $('th', { textContent: id === 'tests' && h === 'Due' ? 'Time' : h })))); // a test is held, not handed in
    table.parentElement.querySelector('.count').textContent = String(items.length).padStart(2, '0');
    const late = items.filter(overdue).length;
    const soon = items.filter(upcoming).length;
    const lamp = table.parentElement.querySelector('.lamp'); // maroon: something overdue; amber: due soon; green: clear
    lamp.className = `lamp ${late ? 'error' : soon ? 'login' : 'ok'}`;
    tip(lamp, late ? `${late} overdue` : soon ? `${soon} due within ${UPCOMING_DAYS} days` : `Nothing due within ${UPCOMING_DAYS} days`);
    table.tBodies[0].replaceChildren(...items.map(toRow).map((tr) => { if (!typed) tr.children[1].remove(); return tr; }));
  }
  // An empty part is hidden; with nothing at all, the coursework part says so
  document.getElementById('tests-part').hidden = !parts[0][1].length;
  document.getElementById('labs-part').hidden = !parts[1][1].length;
  document.getElementById('work-part').hidden = !parts[2][1].length && !!shown.length;
  if (!shown.length) {
    const clear = $('button', { textContent: 'Clear filters', onclick: () => { course = ''; hideDone = false; render(); } });
    document.getElementById('list').append($('tr', {}, $('td', { className: 'empty', colSpan: cols.length }, 'No items match these filters.', clear)));
  }
  // Course grades under the list: every course shown in the course buttons (AC29)
  document.querySelector('#grades tbody').replaceChildren(...courses.filter((c) => c !== '(no course)').map((c) => {
    const g = data.courses[c] || { grade: null, graded_pct: 0 };
    const pct = Math.max(0, Math.min(100, g.graded_pct || 0));
    const gauge = $('span', { className: 'gauge' }); // segments lit for the share of the course already graded
    gauge.style.setProperty('--fill', `${pct}%`);
    const tr = $('tr', {}, ...[c, g.grade == null ? '—' : `${g.grade.toFixed(1)}%`].map((t) => $('td', { textContent: t })), // AC83
      $('td', {}, gauge, `${pct.toFixed(0)}%`));
    tr.style.setProperty('--c', colorOf(c));
    return tr;
  }));
  timed = [...document.querySelectorAll('.items tbody tr')].map((tr) => [tr, tr.item]).filter(([, i]) => i && i.due && !i.done);
  tick();
  alignDots(document.querySelector('main')); // both item tables share one date width, so their dots line up too
  alignDots(document.getElementById('sources'));
  pin();
}

// Time left changes at whole hours of time remaining (whole minutes under a day). Refresh only those cells, and the
// row's overdue/upcoming colour, exactly when the next one changes; nothing runs in between.
let timed = []; // [row, item] for open items with a due date
let showPicked = () => {}; // set by render(): fills the Next test / Next lab boxes with a hovered item, or the next ones
let tickTimer;
function tick() {
  clearTimeout(tickTimer);
  const now = Date.now();
  let wait = Infinity;
  for (const [tr, i] of timed) {
    tr.querySelector('.left').textContent = left(i);
    tr.classList.toggle('overdue', overdue(i));
    tr.classList.toggle('upcoming', upcoming(i));
    const rest = dueMs(i) - now;
    const unit = Math.abs(rest) >= 864e5 ? 36e5 : 6e4;
    wait = Math.min(wait, rest > 0 ? rest % unit || unit : unit - (-rest % unit));
  }
  if (wait < Infinity) tickTimer = setTimeout(tick, wait + 50);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); }); // timers sleep in background tabs

// The column titles and the sidebar stick just below the calendar, whose height depends on what it holds.
function pin() {
  document.documentElement.style.setProperty('--head-top', `${document.getElementById('cal-wrap').offsetHeight}px`);
}
window.addEventListener('resize', pin);

document.getElementById('edit').addEventListener('click', () => {
  if (editing() && pending.size && !confirm(`Discard ${pending.size} unsaved change(s)?`)) return;
  pending.clear();
  localStorage.setItem('editMode', editing() ? '0' : '1');
  render();
});
document.getElementById('save').addEventListener('click', saveAll);
window.addEventListener('beforeunload', (e) => { if (pending.size) e.preventDefault(); }); // reload or close with unsaved edits
document.querySelector('#add [name=kind]').append(...KINDS.map((k) => $('option', { value: k, textContent: k })));
document.getElementById('add').addEventListener('submit', add);
document.getElementById('cal-back').append(icon(...UP));
document.getElementById('cal-today').append(icon(...RETICLE));
document.getElementById('cal-fwd').append(icon(...DOWN));
document.getElementById('mark').append(icon(...BADGE));
document.getElementById('host').textContent = `Link ${location.host}`; // the local server this page talks to
document.getElementById('cal-back').addEventListener('click', () => { calOffset -= STEP; render(); });
document.getElementById('cal-fwd').addEventListener('click', () => { calOffset += STEP; render(); });
document.getElementById('cal-today').addEventListener('click', () => { calOffset = 0; render(); });
const glyph = document.body.appendChild($('span', { textContent: '✓' })); // size the Done column to the glyph
document.documentElement.style.setProperty('--tick', `${Math.ceil(glyph.getBoundingClientRect().width) + 4}px`);
glyph.remove();
// Page tooltip: any element with data-tip shows it below itself (above, near the bottom of the window), after its
// data-tip-delay in ms if it has one.
const tipBox = document.getElementById('tip');
let tipFor = null; // element whose tooltip is showing or pending
let tipTimer;
const hideTip = () => { clearTimeout(tipTimer); tipFor = null; tipBox.hidden = true; };
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-tip]');
  if (t === tipFor) return; // still inside the same element
  hideTip();
  if (!t) return;
  tipFor = t;
  tipTimer = setTimeout(() => {
    tipBox.textContent = t.dataset.tip;
    tipBox.hidden = false;
    const r = t.getBoundingClientRect();
    const x = Math.min(Math.max(8, r.left + r.width / 2 - tipBox.offsetWidth / 2), innerWidth - tipBox.offsetWidth - 8);
    const y = r.bottom + 6 + tipBox.offsetHeight > innerHeight - 8 ? r.top - tipBox.offsetHeight - 6 : r.bottom + 6;
    tipBox.style.left = `${x}px`;
    tipBox.style.top = `${y}px`;
  }, Number(t.dataset.tipDelay) || 0);
});
document.documentElement.addEventListener('mouseleave', hideTip);
document.addEventListener('scroll', hideTip, true);
load();
</script>
</html>
